<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Профиль — SN music</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    
    const firebaseConfig = { apiKey: "AIzaSyCWlkDjzylbhDMl1bN33fn-sQx3BFTIfMc", authDomain: "sn-music-d3c6c.firebaseapp.com", projectId: "sn-music-d3c6c", storageBucket: "sn-music-d3c6c.firebasestorage.app", messagingSenderId: "308834788211", appId: "1:308834788211:web:367f727c45a812b8835b06" };
    const auth = getAuth(initializeApp(firebaseConfig));
    const db = supabase.createClient('https://fgljnqcxjbpunlfwoktb.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnbGpucWN4amJwdW5sZndva3RiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2ODUzMzgsImV4cCI6MjEwODI2MTMzOH0.LPeIh77qTlhg8NmP5a6hZOVEDSgQeB57V6l8SMhXoeo');
    
    let user = null;
    window.logout = async () => { await signOut(auth); location.reload(); };
    
    onAuthStateChanged(auth, async (u) => {
      user = u;
      if (u) {
        document.getElementById('authView').style.display = 'none';
        document.getElementById('profView').style.display = 'block';
        const name = u.email.split('@')[0];
        document.getElementById('dispName').textContent = name;
        document.getElementById('editName').value = name;
        
        if (u.email === 'nur41games@gmail.com') {
          document.getElementById('role').textContent = 'Админ';
          document.getElementById('role').style.color = 'var(--accent)';
          document.getElementById('adminTools').style.display = 'block';
        } else {
          document.getElementById('role').textContent = 'Слушатель / Артист';
        }
        
        const { data: prof } = await db.from('artist_profiles').select('*').eq('name', name).single();
        if (prof) {
          if (prof.banner_url) document.getElementById('banner').style.backgroundImage = `url(${prof.banner_url})`;
          if (prof.avatar_url) { const av = document.getElementById('avatarBig'); av.style.backgroundImage = `url(${prof.avatar_url})`; av.textContent = ''; }
        }
        
        document.getElementById('artistLink').href = `artist.html?name=${name}`;
        loadPlaylists();
      } else {
        document.getElementById('authView').style.display = 'block';
        document.getElementById('profView').style.display = 'none';
      }
    });

    window.saveProf = async () => {
      const n = document.getElementById('editName').value;
      const av = document.getElementById('editAvatar').value;
      const bn = document.getElementById('editBanner').value;
      const { data: ex } = await db.from('artist_profiles').select('name').eq('name', user.email.split('@')[0]).single();
      
      if (ex) await db.from('artist_profiles').update({ avatar_url: av, banner_url: bn }).eq('name', user.email.split('@')[0]);
      else await db.from('artist_profiles').insert({ name: user.email.split('@')[0], avatar_url: av, banner_url: bn });
      
      alert('Сохранено!');
      location.reload();
    };

    async function loadPlaylists() {
      const name = user.email.split('@')[0];
      const list = document.getElementById('playlists');
      const { data: likes } = await db.from('likes').select('*').eq('user_id', user.uid);
      
      let html = `<div style="padding:12px; border-bottom:1px solid #333;"><b>Избранное ♥</b> <span style="float:right">${likes?.length || 0}</span></div>`;
      
      const { data: pls } = await db.from('playlists').select('*').eq('user_id', user.uid);
      if (pls) pls.forEach(p => {
        html += `<div style="padding:12px; border-bottom:1px solid #333; display:flex; justify-content:space-between;">
          <b>${p.name} ${p.is_chart ? '<span style="color:var(--vip);font-size:10px">ЧАРТ</span>' : ''}</b>
          ${user.email === 'nur41games@gmail.com' ? `<button onclick="delPl('${p.id}')" style="background:none;border:none;color:red;cursor:pointer;">X</button>` : ''}
        </div>`;
      });
      list.innerHTML = html;
    }
    
    window.delPl = async (id) => { if(confirm('Удалить?')) { await db.from('playlists').delete().eq('id', id); loadPlaylists(); } };
    window.createChart = async () => {
      const n = prompt('Название Чарта:'); if (!n) return;
      await db.from('playlists').insert({ user_id: user.uid, name: n, is_chart: true }); loadPlaylists();
    };

    window.toggleLogin = () => {
      const isLogin = document.getElementById('formTitle').innerText === 'Вход';
      document.getElementById('formTitle').innerText = isLogin ? 'Регистрация' : 'Вход';
      document.getElementById('btnSub').innerText = isLogin ? 'Создать аккаунт' : 'Войти';
      document.getElementById('swText').innerHTML = isLogin ? 'Есть аккаунт? <a onclick="toggleLogin()">Войти</a>' : 'Нет аккаунта? <a onclick="toggleLogin()">Регистрация</a>';
    };

    document.getElementById('authForm').onsubmit = async (e) => {
      e.preventDefault();
      const em = document.getElementById('email').value, ps = document.getElementById('pass').value;
      const isLogin = document.getElementById('formTitle').innerText === 'Вход';
      try {
        if (isLogin) await signInWithEmailAndPassword(auth, em, ps);
        else await createUserWithEmailAndPassword(auth, em, ps);
      } catch (err) { document.getElementById('err').innerText = err.message; document.getElementById('err').style.display = 'block'; }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #09090b; --surface: #18181b; --text: #f4f4f5; --muted: #a1a1aa; --accent: #8b5cf6; --danger: #ef4444; --vip: #fbbf24; --radius: 16px; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; padding-bottom: 80px; }
    .card { background: var(--surface); border-radius: var(--radius); padding: 32px 24px; width: 100%; max-width: 450px; }
    .logo { text-align: center; margin-bottom: 20px; }
    .logo img { height: 50px; border-radius: 10px; }
    h2 { text-align: center; margin-bottom: 20px; font-size: 20px; }
    input[type="text"], input[type="email"], input[type="password"] { width: 100%; background: var(--bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px; color: var(--text); font-size: 15px; margin-bottom: 12px; outline: none; }
    input:focus { border-color: var(--accent); }
    .btn { width: 100%; background: var(--accent); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
    .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); margin-top: 20px; }
    .switch { text-align: center; margin-top: 20px; font-size: 14px; color: var(--muted); }
    .switch a { color: var(--accent); cursor: pointer; font-weight: 600; }
    .error { color: var(--danger); font-size: 13px; text-align: center; margin-bottom: 12px; display: none; }
    
    .banner { height: 120px; background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(9,9,11,1)); background-size: cover; border-radius: 12px 12px 0 0; margin: -32px -24px 0 -24px; }
    .avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--accent); border: 4px solid var(--surface); margin: -40px auto 10px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; background-size: cover; }
    .tabs { display: flex; gap: 10px; margin-bottom: 16px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .tab { background: none; border: none; color: var(--muted); font-weight: 600; cursor: pointer; padding: 5px; }
    .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: rgba(15,19,27,0.95); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); text-decoration: none; font-size: 10px; cursor: pointer; width: 25%; }
    .nav-item.active, .nav-item:hover { color: var(--accent); }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="logo.jpg"></div>

    <div id="authView">
      <h2 id="formTitle">Вход</h2>
      <div class="error" id="err"></div>
      <form id="authForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="pass" placeholder="Пароль" required>
        <button type="submit" class="btn" id="btnSub">Войти</button>
      </form>
      <div class="switch" id="swText">Нет аккаунта? <a onclick="toggleLogin()">Регистрация</a></div>
    </div>

    <div id="profView" style="display:none;">
      <div class="banner" id="banner"></div>
      <div class="avatar" id="avatarBig">U</div>
      <div style="text-align:center; margin-bottom:20px;">
        <div style="font-size:20px; font-weight:bold;" id="dispName">Имя</div>
        <div style="font-size:13px; color:var(--muted);" id="role">Слушатель</div>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="document.getElementById('tabEdit').style.display='block';document.getElementById('tabPl').style.display='none';this.classList.add('active');this.nextElementSibling.classList.remove('active')">Профиль</button>
        <button class="tab" onclick="document.getElementById('tabEdit').style.display='none';document.getElementById('tabPl').style.display='block';this.classList.add('active');this.previousElementSibling.classList.remove('active')">Плейлисты</button>
      </div>

      <div id="tabEdit">
        <input type="text" id="editName" placeholder="Новое имя" style="display:none;">
        <input type="text" id="editAvatar" placeholder="URL аватарки">
        <input type="text" id="editBanner" placeholder="URL фона">
        <button class="btn btn-outline" onclick="saveProf()">Сохранить</button>
        <a href="#" id="artistLink" class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:10px;">Моя страница</a>
        <button class="btn btn-danger" onclick="logout()">Выйти</button>
        <div id="adminTools" style="display:none; margin-top:20px; border-top:1px solid #333; padding-top:15px;">
          <button class="btn btn-outline" onclick="createChart()">+ Создать Чарт</button>
        </div>
      </div>

      <div id="tabPl" style="display:none;">
        <div id="playlists"></div>
      </div>
    </div>
    
    <div style="text-align:center; margin-top:20px;"><a href="index.html" style="color:var(--muted); text-decoration:none;">← На главную</a></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Главная</span></a>
    <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span>Поиск</span></a>
    <a href="upload.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Загрузить</span></a>
    <a href="auth.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Профиль</span></a>
  </nav>
</body>
</html>
