<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Профиль — SN music</title>
  <style>
    :root { --bg: #0d0f14; --card: #161a22; --text: #e6e9ef; --muted: #8b93a7; --accent: #6c5ce7; --radius: 14px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .icon { font-size: 60px; margin-bottom: 20px; }
    h2 { font-size: 22px; margin-bottom: 10px; }
    p { color: var(--muted); font-size: 15px; margin-bottom: 30px; line-height: 1.5; }
    .btn { background: linear-gradient(90deg, var(--accent), #8a7bff); border: none; color: #fff; padding: 14px 24px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
    
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #0f131b; border-top: 1px solid #232a38; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); text-decoration: none; font-size: 11px; transition: 0.2s; cursor: pointer; width: 25%; }
    .nav-item.active, .nav-item:hover { color: var(--accent); }
    .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
  </style>
</head>
<body>
  <div class="icon">🔒</div>
  <h2>Личный кабинет</h2>

</html>
