<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Вход / Регистрация — SN music</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg: #0d0f14; --card: #161a22; --text: #e6e9ef; --muted: #8b93a7; --accent: #6c5ce7; --radius: 14px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; padding-bottom: 80px; }
    
    .auth-card { background: var(--card); border: 1px solid #232a38; border-radius: var(--radius); padding: 32px 24px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin: auto; }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo img { height: 60px; border-radius: 8px; }
    .logo-text { display: block; font-size: 24px; font-weight: 700; margin-top: 10px; background: linear-gradient(90deg, #6c5ce7, #00d4aa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    h2 { text-align: center; margin-bottom: 20px; font-size: 18px; font-weight: 500; }
    
    input { width: 100%; background: #0f131b; border: 1px solid #2a3142; border-radius: 10px; padding: 14px; color: var(--text); font-size: 15px; outline: none; margin-bottom: 12px; transition: 0.2s; }
    input:focus { border-color: var(--accent); }
    
    .btn { background: linear-gradient(90deg, var(--accent), #8a7bff); border: none; color: #fff; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; }
    .btn:hover { opacity: 0.9; }
    
    .switch-form { text-align: center; margin-top: 20px; font-size: 14px; color: var(--muted); }
    .switch-form a { color: var(--accent); text-decoration: none; cursor: pointer; font-weight: 600; }
    
    .error { color: #ff5c5c; font-size: 13px; text-align: center; margin-bottom: 10px; display: none; }
    .success { color: #00d4aa; font-size: 13px; text-align: center; margin-bottom: 10px; display: none; }

    /* НИЖНЯЯ НАВИГАЦИЯ */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #0f131b; border-top: 1px solid #232a38; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); text-decoration: none; font-size: 11px; transition: 0.2s; cursor: pointer; width: 25%; }
    .nav-item.active, .nav-item:hover { color: var(--accent); }
    .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo">
      <img src="logo.jpg" alt="Logo">
      <span class="logo-text">SN music</span>
    </div>
    
    <h2 id="formTitle">Вход в аккаунт</h2>
    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <form id="authForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Пароль (мин. 6 символов)" required>
      <button type="submit" class="btn" id="submitBtn">Войти</button>
    </form>
    
    <div class="switch-form">
      <span id="switchText">Нет аккаунта?</span> <a onclick="toggleMode()" id="switchLink">Зарегистрироваться</a>
    </div>
    <div class="switch-form" style="margin-top: 10px;">
      <a href="index.html" style="color: var(--muted);">← Вернуться на главную</a>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Главная</span>
    </a>
    <a href="index.html" class="nav-item" onclick="setTimeout(() => focusSearch(), 100)">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <span>Поиск</span>
    </a>
    <a href="upload.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      <span>Загрузить</span>
    </a>
    <a href="auth.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Профиль</span>
    </a>
  </nav>

  <script>
    const SUPABASE_URL = 'https://fgljnqcxjbpunlfwoktb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnbGpucWN4amJwdW5sZndva3RiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2ODUzMzgsImV4cCI6MjEwODI2MTMzOH0.LPeIh77qTlhg8NmP5a6hZOVEDSgQeB57V6l8SMhXoeo';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isLoginMode = true;
    $ = (id) => document.getElementById(id);

    function toggleMode() {
      isLoginMode = !isLoginMode;
      $('formTitle').textContent = isLoginMode ? 'Вход в аккаунт' : 'Регистрация';
      $('submitBtn').textContent = isLoginMode ? 'Войти' : 'Создать аккаунт';
      $('switchText').textContent = isLoginMode ? 'Нет аккаунта?' : 'Уже есть аккаунт?';
      $('switchLink').textContent = isLoginMode ? 'Зарегистрироваться' : 'Войти';
      $('errorMsg').style.display = 'none';
      $('successMsg').style.display = 'none';
    }

    $('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('email').value.trim();
      const password = $('password').value;
      const btn = $('submitBtn');
      
      btn.disabled = true;
      btn.textContent = 'Загрузка...';
      $('errorMsg').style.display = 'none';
      $('successMsg').style.display = 'none';

      try {
        if (isLoginMode) {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          window.location.href = 'index.html';
        } else {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) throw error;
          
          if (data.user && data.session === null) {
            $('successMsg').textContent = 'Проверьте почту для подтверждения регистрации!';
            $('successMsg').style.display = 'block';
          } else {
             window.location.href = 'index.html';
          }
        }
      } catch (error) {
        $('errorMsg').textContent = error.message;
        $('errorMsg').style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = isLoginMode ? 'Войти' : 'Создать аккаунт';
      }
    });
  </script>
</body>
  </html>
