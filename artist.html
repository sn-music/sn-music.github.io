<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Артист — SN music</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #09090b; --surface: #18181b; --text: #f4f4f5; --muted: #a1a1aa; --accent: #8b5cf6; --vip: #fbbf24; --radius: 16px; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 160px; }
    header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo img { height: 36px; border-radius: 10px; }
    .logo-text { font-size: 20px; font-weight: 800; background: linear-gradient(90deg, #a78bfa, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .btn-back { color: var(--text); text-decoration: none; padding: 8px 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 100px; font-size: 14px; }
    main { max-width: 800px; margin: 0 auto; padding: 20px; }
    .artist-hero { background: var(--surface); border-radius: var(--radius); overflow: hidden; margin-bottom: 24px; text-align: center; }
    .hero-banner { height: 140px; background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(9,9,11,1)); background-size: cover; background-position: center; }
    .hero-content { padding: 0 24px 24px; margin-top: -50px; }
    .artist-avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--accent); border: 4px solid var(--bg); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800; background-size: cover; background-position: center; }
    .artist-name { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    .artist-stats { display: flex; gap: 24px; justify-content: center; margin-top: 16px; }
    .stat-val { font-size: 20px; font-weight: 800; color: var(--accent); }
    .stat-label { font-size: 12px; color: var(--muted); }
    .track { background: var(--surface); border-radius: var(--radius); padding: 12px; display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
    .track-cover { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
    .track-title { font-size: 16px; font-weight: 600; }
    .track-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .play-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .play-btn svg { width: 18px; height: 18px; fill: white; margin-left: 2px; }
    
    .bottom-player { position: fixed; bottom: 70px; left: 12px; right: 12px; background: rgba(24, 24, 27, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 10px 14px; display: none; align-items: center; gap: 12px; z-index: 1000; cursor: pointer; }
    .bottom-player.active { display: flex; }
    .bp-cover { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }
    .bp-info { flex: 1; min-width: 0; }
    .bp-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bp-artist { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bp-controls { display: flex; align-items: center; gap: 10px; }
    .bp-btn.play-pause { background: #fff; color: #000; width: 44px; height: 44px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; }
    .bp-btn.play-pause svg { width: 24px; height: 24px; fill: currentColor; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: rgba(15, 19, 27, 0.95); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; align-items: center; z-index: 1001; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); text-decoration: none; font-size: 10px; cursor: pointer; flex: 1; }
    .nav-item.active, .nav-item:hover { color: var(--accent); }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    
    .full-player { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; padding: 24px; transform: translateY(100%); transition: transform 0.4s; height: 100dvh; }
    .full-player.show { transform: translateY(0); }
    .fp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .fp-close { background: rgba(255,255,255,0.08); border: none; width: 36px; height: 36px; border-radius: 50%; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .fp-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; width: 100%; max-width: 500px; margin: 0 auto; }
    .fp-cover { width: 100%; max-width: 320px; aspect-ratio: 1/1; border-radius: 20px; object-fit: cover; margin-bottom: 24px; }
    .fp-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .fp-artist { font-size: 16px; color: var(--muted); margin-bottom: 20px; text-decoration: none; display: block; }
    .fp-artist:hover { color: var(--accent); }
    .custom-progress-container { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .custom-progress { width: 100%; -webkit-appearance: none; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15); outline: none; }
    .custom-progress::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; cursor: pointer; }
    .time-display { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .fp-buttons { display: flex; align-items: center; justify-content: center; gap: 24px; }
    .fp-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; }
    .fp-btn svg { width: 28px; height: 28px; fill: currentColor; }
    .fp-btn.play-pause { width: 64px; height: 64px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .fp-btn.play-pause svg { width: 32px; height: 32px; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo"><img src="logo.jpg"><span class="logo-text">SN music</span></a>
    <a href="index.html" class="btn-back">← На главную</a>
  </header>

  <main>
    <div class="artist-hero">
      <div class="hero-banner" id="heroBanner"></div>
      <div class="hero-content">
        <div class="artist-avatar" id="artistAvatar">A</div>
        <div class="artist-name" id="artistName">Имя Артиста</div>
        <div class="artist-stats">
          <div><div class="stat-val" id="statTracks">0</div><div class="stat-label">Треков</div></div>
          <div><div class="stat-val" id="statPlays">0</div><div class="stat-label">Прослушиваний</div></div>
        </div>
      </div>
    </div>
    <h2 style="margin-bottom: 16px;">Треки артиста</h2>
    <div id="artistTracks"></div>
  </main>

  <div class="bottom-player" id="bottomPlayer" onclick="openFullPlayer()">
    <img src="logo.jpg" class="bp-cover" id="bpCover">
    <div class="bp-info">
      <div class="bp-title" id="bpTitle">Название</div>
      <div class="bp-artist" id="bpArtist">Артист</div>
    </div>
    <div class="bp-controls">
      <button class="bp-btn play-pause" id="bpPlayBtn" onclick="event.stopPropagation(); togglePlay()"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Главная</span></a>
    <a href="index.html" class="nav-item" onclick="localStorage.setItem('focus_search','1')"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span>Поиск</span></a>
    <a href="upload.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Загрузить</span></a>
    <a href="index.html" class="nav-item" onclick="localStorage.setItem('open_analytics','1')"><svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg><span>Аналитика</span></a>
    <a href="auth.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Профиль</span></a>
  </nav>

  <div class="full-player" id="fullPlayer">
    <div class="fp-header">
      <button class="fp-close" onclick="closeFullPlayer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
      <div style="font-size: 12px; font-weight: 700; color: var(--muted);">СЕЙЧАС ИГРАЕТ</div>
      <div style="width: 36px;"></div>
    </div>
    <div class="fp-content">
      <img src="logo.jpg" class="fp-cover" id="fpCover">
      <div class="fp-title" id="fpTitle">Название</div>
      <a href="#" class="fp-artist" id="fpArtistLink">Артист</a>
    </div>
    <div style="width:100%;">
      <div class="custom-progress-container">
        <input type="range" class="custom-progress" id="progressBar" value="0" min="0" max="100" step="0.1">
        <div class="time-display"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div>
      </div>
      <audio id="mainAudio"></audio>
      <div class="fp-buttons">
        <button class="fp-btn" onclick="playPrev()"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button class="fp-btn play-pause" id="fpPlayBtn" onclick="togglePlay()"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="fp-btn" onclick="playNext()"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      </div>
    </div>
  </div>

  <script>
    const supabaseClient = supabase.createClient('https://fgljnqcxjbpunlfwoktb.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnbGpucWN4amJwdW5sZndva3RiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2ODUzMzgsImV4cCI6MjEwODI2MTMzOH0.LPeIh77qTlhg8NmP5a6hZOVEDSgQeB57V6l8SMhXoeo');
    const params = new URLSearchParams(window.location.search);
    const artistName = params.get('name');
    if (!artistName) window.location.href = 'index.html';

    const $ = (id) => document.getElementById(id);
    let tracks = [], playQueue = [], currentIndex = -1;
    
    // --- ГЛОБАЛЬНЫЙ ПЛЕЕР ---
    let currentPlayingTrack = null;
    const audio = $('mainAudio');

    function savePlayerState() {
      if (currentPlayingTrack && audio) {
        localStorage.setItem('sn_player_state', JSON.stringify({
          track: currentPlayingTrack, time: audio.currentTime, isPlaying: !audio.paused
        }));
      }
    }
    setInterval(savePlayerState, 1000);
    window.addEventListener('beforeunload', savePlayerState);

    function setupTrackUI(track) {
      currentPlayingTrack = track;
      $('bpTitle').textContent = track.title; $('bpArtist').textContent = track.artist; $('bpCover').src = track.cover_url || 'logo.jpg';
      $('fpTitle').textContent = track.title; $('fpArtistLink').textContent = track.artist; $('fpArtistLink').href = `artist.html?name=${encodeURIComponent(track.artist)}`;
      $('fpCover').src = track.cover_url || 'logo.jpg';
      $('bottomPlayer').classList.add('active');
    }

    function playTrackGlobal(track) {
      setupTrackUI(track);
      audio.src = track.audio_url;
      audio.play().catch(()=>{});
      localStorage.setItem('sn_player_state', JSON.stringify({ track: track, time: 0, isPlaying: true }));
    }

    function loadPlayerState() {
      const saved = localStorage.getItem('sn_player_state');
      if (saved) {
        try {
          const state = JSON.parse(saved);
          if (state.track) {
            setupTrackUI(state.track);
            audio.src = state.track.audio_url;
            audio.addEventListener('loadedmetadata', () => {
              audio.currentTime = state.time;
              if (state.isPlaying) audio.play().catch(()=>{});
            }, { once: true });
          }
        } catch(e) {}
      }
    }
    loadPlayerState();

    function formatTime(s) { if (isNaN(s) || s === Infinity) return "0:00"; const m = Math.floor(s/60), sec = Math.floor(s%60); return `${m}:${sec < 10 ? '0' : ''}${sec}`; }
    audio.addEventListener('timeupdate', () => { if (!audio.duration) return; const p = (audio.currentTime/audio.duration)*100; $('progressBar').value = audio.currentTime; $('currentTime').textContent = formatTime(audio.currentTime); $('progressBar').style.background = `linear-gradient(to right, #fff ${p}%, rgba(255,255,255,0.15) ${p}%)`; });
    audio.addEventListener('loadedmetadata', () => { $('progressBar').max = audio.duration; $('totalTime').textContent = formatTime(audio.duration); });
    $('progressBar').addEventListener('input', (e) => { audio.currentTime = parseFloat(e.target.value); });

    window.playTrack = (id) => {
      currentIndex = playQueue.findIndex(t => t.id === id);
      if (currentIndex !== -1) playTrackGlobal(playQueue[currentIndex]);
    };
    window.togglePlay = () => { if (audio.paused) { audio.play(); } else { audio.pause(); } };
    window.playNext = () => { if (currentIndex < playQueue.length - 1) { currentIndex++; playTrackGlobal(playQueue[currentIndex]); } };
    window.playPrev = () => { if (currentIndex > 0) { currentIndex--; playTrackGlobal(playQueue[currentIndex]); } };
    window.openFullPlayer = () => { $('fullPlayer').classList.add('show'); };
    window.closeFullPlayer = () => { $('fullPlayer').classList.remove('show'); };
    
    audio.addEventListener('play', () => { $('bpPlayBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'; $('fpPlayBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'; });
    audio.addEventListener('pause', () => { $('bpPlayBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'; $('fpPlayBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'; });

    async function load() {
      $('artistName').textContent = artistName;
      $('artistAvatar').textContent = artistName[0].toUpperCase();
      
      const { data: prof } = await supabaseClient.from('artist_profiles').select('*').eq('name', artistName).single();
      if (prof) {
        if (prof.banner_url) $('heroBanner').style.backgroundImage = `url(${prof.banner_url})`;
        if (prof.avatar_url) { $('artistAvatar').style.backgroundImage = `url(${prof.avatar_url})`; $('artistAvatar').textContent = ''; }
      }

      const { data: tr } = await supabaseClient.from('tracks').select('*').eq('artist', artistName).eq('status', 'approved').order('created_at', {ascending: false});
      tracks = tr || []; playQueue = tracks;
      $('statTracks').textContent = tracks.length;
      $('statPlays').textContent = tracks.reduce((s, t) => s + (t.plays||0), 0);

      $('artistTracks').innerHTML = tracks.map(t => `
        <div class="track">
          <img src="${t.cover_url || 'logo.jpg'}" class="track-cover">
          <div style="flex:1"><div class="track-title">${t.title}</div><div class="track-meta">${t.genre} • ▶ ${t.plays||0}</div></div>
          <button class="play-btn" onclick="playTrack('${t.id}')"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        </div>
      `).join('');
    }

    load();
  </script>
</body>
</html>
