<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Загрузка — SN music</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #09090b; --surface: #18181b; --text: #f4f4f5; --muted: #a1a1aa; --accent: #8b5cf6; --radius: 16px; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 80px; }
    header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo img { height: 36px; border-radius: 10px; }
    .logo-text { font-size: 20px; font-weight: 800; background: linear-gradient(90deg, #a78bfa, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .btn-back { color: var(--text); text-decoration: none; padding: 8px 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 100px; font-size: 14px; }
    main { max-width: 600px; margin: 0 auto; padding: 24px 20px; }
    .form-card { background: var(--surface); border-radius: var(--radius); padding: 24px; }
    h2 { text-align: center; margin-bottom: 24px; font-size: 22px; }
    input[type="text"], textarea, select { width: 100%; background: var(--bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px; color: var(--text); font-size: 15px; margin-bottom: 16px; outline: none; }
    input:focus, textarea:focus { border-color: var(--accent); }
    .file-upload { position: relative; border: 2px dashed rgba(255,255,255,0.15); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 16px; cursor: pointer; }
    .file-upload input { position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; }
    .file-upload span { color: var(--muted); font-size: 14px; }
    .file-upload.has-file { border-color: var(--accent); background: rgba(139,92,246,0.05); }
    .btn { width: 100%; background: var(--accent); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .btn:disabled { opacity: 0.5; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: rgba(15,19,27,0.95); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); text-decoration: none; font-size: 10px; cursor: pointer; width: 25%; }
    .nav-item.active, .nav-item:hover { color: var(--accent); }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: var(--accent); color: white; padding: 12px 24px; border-radius: 100px; opacity: 0; transition: 0.3s; z-index: 3000; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo"><img src="logo.jpg"><span class="logo-text">SN music</span></a>
    <a href="index.html" class="btn-back">← На главную</a>
  </header>

  <main>
    <div class="form-card">
      <h2>Загрузить трек</h2>
      <form id="upForm">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <input type="text" id="artist" placeholder="Артист" required>
          <input type="text" id="title" placeholder="Название" required>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <input type="text" id="genre" placeholder="Жанр">
          <select id="type"><option value="release">Релиз</option><option value="demo">Демо</option></select>
        </div>
        <textarea id="desc" placeholder="Описание..."></textarea>
        
        <div class="file-upload" id="audio-box">
          <input type="file" id="audioFile" accept="audio/*" required onchange="upd(this,'audio-box')">
          <span>Выбрать MP3</span>
        </div>
        <div class="file-upload" id="cover-box">
          <input type="file" id="coverFile" accept="image/*" onchange="upd(this,'cover-box')">
          <span>Выбрать обложку</span>
        </div>
        
        <button type="submit" class="btn" id="btn">Отправить</button>
      </form>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Главная</span></a>
    <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span>Поиск</span></a>
    <a href="upload.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Загрузить</span></a>
    <a href="auth.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Профиль</span></a>
  </nav>

  <div class="toast" id="toast"></div>

  <script>
    const supabaseClient = supabase.createClient('https://fgljnqcxjbpunlfwoktb.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnbGpucWN4amJwdW5sZndva3RiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2ODUzMzgsImV4cCI6MjEwODI2MTMzOH0.LPeIh77qTlhg8NmP5a6hZOVEDSgQeB57V6l8SMhXoeo');
    
    const firebaseConfig = { apiKey: "AIzaSyCWlkDjzylbhDMl1bN33fn-sQx3BFTIfMc", authDomain: "sn-music-d3c6c.firebaseapp.com", projectId: "sn-music-d3c6c", storageBucket: "sn-music-d3c6c.firebasestorage.app", messagingSenderId: "308834788211", appId: "1:308834788211:web:367f727c45a812b8835b06" };
    firebase.initializeApp(firebaseConfig);
    firebase.auth().onAuthStateChanged(user => { if(user && !document.getElementById('artist').value) document.getElementById('artist').value = user.email.split('@')[0]; });

    function upd(input, boxId) {
      const box = document.getElementById(boxId), span = box.querySelector('span');
      if (input.files[0]) { span.textContent = input.files[0].name; box.classList.add('has-file'); }
    }

    document.getElementById('upForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn'); btn.disabled = true; btn.textContent = 'Загрузка...';
      try {
        const aFile = document.getElementById('audioFile').files[0];
        const cFile = document.getElementById('coverFile').files[0];
        
        const aName = `${Date.now()}_${aFile.name}`;
        const { error: aErr } = await supabaseClient.storage.from('audio').upload(aName, aFile);
        if (aErr) throw aErr;
        const aUrl = supabaseClient.storage.from('audio').getPublicUrl(aName).data.publicUrl;

        let cUrl = null;
        if (cFile) {
          const cName = `c_${Date.now()}_${cFile.name}`;
          await supabaseClient.storage.from('audio').upload(cName, cFile);
          cUrl = supabaseClient.storage.from('audio').getPublicUrl(cName).data.publicUrl;
        }

        await supabaseClient.from('tracks').insert({
          artist: document.getElementById('artist').value,
          title: document.getElementById('title').value,
          genre: document.getElementById('genre').value || 'без жанра',
          description: document.getElementById('desc').value,
          type: document.getElementById('type').value,
          audio_url: aUrl, cover_url: cUrl
        });

        const t = document.getElementById('toast'); t.textContent = 'Загружено!'; t.classList.add('show');
        setTimeout(() => window.location.href = 'index.html', 1500);
      } catch (err) { alert(err.message); btn.disabled = false; btn.textContent = 'Отправить'; }
    };
  </script>
</body>
</html>
