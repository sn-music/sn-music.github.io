<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Загрузка трека — SN music</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #09090b; --surface: #18181b; --text: #f4f4f5; --muted: #a1a1aa; --accent: #8b5cf6; --radius: 16px; --danger: #ef4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 80px; }
    header { position: sticky; top: 0; z-index: 100; background: rgba(9, 9, 11, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo img { height: 36px; width: 36px; border-radius: 10px; object-fit: cover; }
    .logo-text { font-size: 20px; font-weight: 800; background: linear-gradient(90deg, #a78bfa, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .btn-back { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 8px 16px; border-radius: 100px; font-size: 14px; font-weight: 500; text-decoration: none; }
    main { flex: 1; width: 100%; max-width: 600px; margin: 0 auto; padding: 24px 20px; }
    .form-card { background: var(--surface); border: 1px solid rgba(255,255,255,0.05); border-radius: var(--radius); padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    h2 { font-size: 22px; font-weight: 800; margin-bottom: 24px; text-align: center; }
    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }
    label { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 4px; }
    input[type="text"], textarea, select { width: 100%; background: var(--bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px 16px; color: var(--text); font-size: 15px; outline: none; transition: 0.3s; font-family: 'Inter', sans-serif; }
    input[type="text"]:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    .file-upload { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); border: 2px dashed rgba(255,255,255,0.15); border-radius: 12px; padding: 24px; cursor: pointer; transition: 0.3s; text-align: center; }
    .file-upload:hover { border-color: var(--accent); background: rgba(139, 92, 246, 0.05); }
    .file-upload input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .file-upload svg { width: 32px; height: 32px; fill: var(--muted); margin-bottom: 8px; }
    .file-upload span { font-size: 14px; color: var(--muted); font-weight: 500; }
    .file-upload.has-file { border-color: var(--accent); border-style: solid; background: rgba(139, 92, 246, 0.1); }
    .btn-submit { background: var(--accent); color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.3s; }
    .btn-submit:hover { background: #7c3aed; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: rgba(15, 19, 27, 0.95); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; align-items: center; z-index: 1001; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); text-decoration: none; font-size: 10px; font-weight: 500; transition: 0.2s; cursor: pointer; width: 20%; }
    .nav-item.active, .nav-item:hover { color: var(--accent); }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--accent); color: white; padding: 12px 24px; border-radius: 100px; font-weight: 600; font-size: 14px; opacity: 0; transition: 0.3s; z-index: 3000; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <img src="logo.jpg" alt="SN">
      <span class="logo-text">SN music</span>
    </a>
    <a href="index.html" class="btn-back">← На главную</a>
  </header>

  <main>
    <div class="form-card">
      <h2>Загрузить трек</h2>
      <form id="uploadForm">
        <div class="form-row">
          <div class="form-group">
            <label>Имя артиста</label>
            <input type="text" id="artist" placeholder="Как вас зовут?" required>
          </div>
          <div class="form-group">
            <label>Название трека</label>
            <input type="text" id="title" placeholder="Название" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Жанр</label>
            <input type="text" id="genre" placeholder="Например: Phonk">
          </div>
          <div class="form-group">
            <label>Тип</label>
            <select id="type">
              <option value="release">Готовый релиз</option>
              <option value="demo">Демо / черновик</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Описание (необязательно)</label>
          <textarea id="description" placeholder="Расскажите о треке..."></textarea>
        </div>
        <div class="form-group">
          <label>Аудиофайл (MP3)</label>
          <div class="file-upload" id="audio-upload-box">
            <input type="file" id="file" accept="audio/*" required onchange="updateFileLabel(this, 'audio-upload-box')">
            <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
            <span id="audio-label">Нажмите, чтобы выбрать MP3</span>
          </div>
        </div>
        <div class="form-group">
          <label>Обложка (картинка, необязательно)</label>
          <div class="file-upload" id="cover-upload-box">
            <input type="file" id="coverFile" accept="image/*" onchange="updateFileLabel(this, 'cover-upload-box')">
            <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            <span id="cover-label">Выберите обложку</span>
          </div>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Отправить на модерацию</button>
      </form>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Главная</span>
    </a>
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span>Поиск</span>
    </a>
    <a href="upload.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Загрузить</span>
    </a>
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg><span>Аналитика</span>
    </a>
    <a href="auth.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Профиль</span>
    </a>
  </nav>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCWlkDjzylbhDMl1bN33fn-sQx3BFTIfMc",
      authDomain: "sn-music-d3c6c.firebaseapp.com",
      projectId: "sn-music-d3c6c",
      storageBucket: "sn-music-d3c6c.firebasestorage.app",
      messagingSenderId: "308834788211",
      appId: "1:308834788211:web:367f727c45a812b8835b06",
      measurementId: "G-CRM9JQLBM8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const SUPABASE_URL = 'https://fgljnqcxjbpunlfwoktb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnbGpucWN4amJwdW5sZndva3RiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2ODUzMzgsImV4cCI6MjEwODI2MTMzOH0.LPeIh77qTlhg8NmP5a6hZOVEDSgQeB57V6l8SMhXoeo';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Если пользователь зашел, автоматически подставляем его имя
    onAuthStateChanged(auth, (user) => {
      if (user) {
        const namePart = user.email.split('@')[0];
        document.getElementById('artist').value = namePart;
      }
    });

    const $ = (id) => document.getElementById(id);
    function showToast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
    function updateFileLabel(input, boxId) {
      const box = $(boxId);
      const label = box.querySelector('span');
      if (input.files && input.files.length > 0) { label.textContent = input.files[0].name; box.classList.add('has-file'); }
      else { label.textContent = boxId === 'audio-upload-box' ? 'Нажмите, чтобы выбрать MP3' : 'Выберите обложку'; box.classList.remove('has-file'); }
    }
    window.updateFileLabel = updateFileLabel;

    $('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const audioFile = $('file').files[0];
      const coverFile = $('coverFile').files[0];
      if (!audioFile) return;

      const btn = $('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Загрузка (1/2)...';

      try {
        const fileName = `${Date.now()}_${audioFile.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
        const { error: uploadError } = await supabaseClient.storage.from('audio').upload(fileName, audioFile);
        if (uploadError) throw uploadError;
        const { data: urlData } = supabaseClient.storage.from('audio').getPublicUrl(fileName);

        let coverUrl = null;
        if (coverFile) {
          btn.textContent = 'Загрузка (2/2)...';
          const coverName = `cover_${Date.now()}_${coverFile.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
          const { error: coverError } = await supabaseClient.storage.from('audio').upload(coverName, coverFile);
          if (!coverError) {
            const { data: coverData } = supabaseClient.storage.from('audio').getPublicUrl(coverName);
            coverUrl = coverData.publicUrl;
          }
        }

        const { error: dbError } = await supabaseClient.from('tracks').insert([{
          artist: $('artist').value.trim(),
          title: $('title').value.trim(),
          genre: $('genre').value.trim() || 'без жанра',
          description: $('description').value.trim(),
          type: $('type').value,
          audio_url: urlData.publicUrl,
          cover_url: coverUrl
        }]);

        if (dbError) throw dbError;

        showToast('Трек успешно загружен! 🎉');
        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
      } catch (error) {
        showToast('Ошибка: ' + error.message);
        btn.disabled = false;
        btn.textContent = 'Отправить на модерацию';
      }
    });
  </script>
</body>
</html>
