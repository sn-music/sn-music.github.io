<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎵 SN music</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #09090b; --surface: #18181b; --surface-hover: #27272a; --text: #f4f4f5; --muted: #a1a1aa; --accent: #8b5cf6; --accent-hover: #7c3aed; --vip: #fbbf24; --danger: #ef4444; --radius: 16px; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 160px; overflow-x: hidden; }
    
    header { position: sticky; top: 0; z-index: 100; background: rgba(9, 9, 11, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; flex-shrink: 0; }
    .logo img { height: 36px; width: 36px; border-radius: 10px; object-fit: cover; }
    .logo-text { font-size: 20px; font-weight: 800; background: linear-gradient(90deg, #a78bfa, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .profile-btn { display: none; background: var(--surface); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 6px 12px; border-radius: 100px; font-size: 13px; font-weight: 600; text-decoration: none; align-items: center; gap: 8px; max-width: 150px; flex-shrink: 0; }
    .profile-btn.active { display: flex; }
    .profile-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; color: white; font-weight: bold; flex-shrink: 0; background-size: cover; background-position: center; }
    .profile-name-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .logout-btn { display: none; background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 6px 12px; border-radius: 100px; font-size: 12px; font-weight: 600; cursor: pointer; margin-left: 8px; }
    .logout-btn.active { display: block; }
    
    .search-container { position: relative; width: 100%; }
    .search-container input { width: 100%; background: var(--surface); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 14px 20px 14px 48px; border-radius: 100px; font-size: 15px; outline: none; }
    .search-container input:focus { border-color: var(--accent); background: var(--surface-hover); }
    .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 18px; }
    
    main { flex: 1; width: 100%; max-width: 800px; margin: 0 auto; padding: 24px 20px; }
    
    .upload-banner { background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(139,92,246,0.02)); border: 1px solid rgba(139,92,246,0.3); border-radius: var(--radius); padding: 32px 24px; margin-bottom: 32px; text-align: center; }
    .upload-banner h2 { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
    .btn-upload { background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; font-size: 16px; padding: 14px 28px; border-radius: 100px; display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer; }
    
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .section-title { font-size: 22px; font-weight: 700; }
    .sort-select { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--muted); padding: 8px 16px; border-radius: 100px; font-size: 13px; outline: none; cursor: pointer; }
    
    .tracks { display: flex; flex-direction: column; gap: 12px; }
    .track { background: var(--surface); border: 1px solid rgba(255,255,255,0.05); border-radius: var(--radius); padding: 12px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .track:hover { background: var(--surface-hover); }
    .track.vip { border-color: rgba(251, 191, 36, 0.3); background: linear-gradient(90deg, rgba(251, 191, 36, 0.05), transparent); }
    .track-cover { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: #000; flex-shrink: 0; }
    .track-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .track-title { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 14px; color: var(--muted); text-decoration: none; }
    .track-artist:hover { color: var(--accent); }
    .track-meta { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; align-items: center; }
    .tag { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 100px; background: rgba(255,255,255,0.1); color: var(--muted); }
    .tag.vip { background: rgba(251, 191, 36, 0.15); color: var(--vip); }
    .tag.plays { background: transparent; color: var(--accent); }
    
    .action-btns { display: flex; align-items: center; gap: 8px; }
    .like-btn, .playlist-btn { background: transparent; border: none; font-size: 22px; cursor: pointer; color: #4a5568; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .like-btn.liked { color: var(--danger); } /* Красный цвет для лайка */
    .playlist-btn:hover { color: var(--accent); }
    .play-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: white; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .play-btn svg { width: 20px; height: 20px; fill: currentColor; margin-left: 2px; }
    
    .admin-actions { display: flex; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); width: 100%; flex-wrap: wrap; }
    .btn-admin { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .btn-admin.delete { color: var(--danger); }
    
    .analytics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 8px; }
    .stat-value { font-size: 32px; font-weight: 800; }
    .chart-box { background: var(--surface); border-radius: var(--radius); padding: 20px; }
    .chart-bars { display: flex; align-items: flex-end; height: 150px; gap: 8px; border-bottom: 1px solid #333; }
    .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; }
    .bar { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; }
    .top-track-item { display: flex; align-items: center; gap: 12px; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 12px; margin-bottom: 8px; }

    .bottom-player { position: fixed; bottom: 70px; left: 12px; right: 12px; background: rgba(24, 24, 27, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 10px 14px; display: none; align-items: center; gap: 12px; z-index: 1000; cursor: pointer; }
    .bottom-player.active { display: flex; }
    .bp-cover { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }
    .bp-info { flex: 1; min-width: 0; }
    .bp-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bp-controls { display: flex; align-items: center; gap: 10px; }
    .bp-btn.play-pause { background: #fff; color: #000; width: 44px; height: 44px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; }
    .bp-btn.play-pause svg { width: 24px; height: 24px; fill: currentColor; }
    
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: rgba(15, 19, 27, 0.95); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; align-items: center; z-index: 1001; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); text-decoration: none; font-size: 10px; cursor: pointer; width: 20%; }
    .nav-item.active, .nav-item:hover { color: var(--accent); }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    #nav-admin-item { display: none; }
    
    .full-player { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; padding: 24px; transform: translateY(100%); transition: transform 0.4s; height: 100dvh; }
    .full-player.show { transform: translateY(0); }
    .fp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .fp-close { background: rgba(255,255,255,0.08); border: none; width: 36px; height: 36px; border-radius: 50%; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .fp-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; width: 100%; max-width: 500px; margin: 0 auto; }
    .fp-cover { width: 100%; max-width: 320px; aspect-ratio: 1/1; border-radius: 20px; object-fit: cover; margin-bottom: 24px; }
    .fp-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .fp-artist { font-size: 16px; color: var(--muted); margin-bottom: 20px; text-decoration: none; display: block; }
    .fp-artist:hover { color: var(--accent); }
    .fp-extra-actions { display: flex; gap: 20px; margin-bottom: 20px; }
    .fp-extra-btn { background: transparent; border: none; font-size: 24px; cursor: pointer; color: var(--muted); transition: 0.2s; }
    .fp-extra-btn.liked { color: var(--danger); }
    .fp-extra-btn:hover { color: var(--text); }
    
    .custom-progress-container { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .custom-progress { width: 100%; -webkit-appearance: none; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15); outline: none; }
    .custom-progress::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; cursor: pointer; }
    .time-display { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .fp-buttons { display: flex; align-items: center; justify-content: center; gap: 24px; }
    .fp-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; }
    .fp-btn svg { width: 28px; height: 28px; fill: currentColor; }
    .fp-btn.play-pause { width: 64px; height: 64px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .fp-btn.play-pause svg { width: 32px; height: 32px; }
    
    .view-section { display: none; } .view-section.active { display: block; }
    .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: var(--accent); color: white; padding: 12px 24px; border-radius: 100px; opacity: 0; transition: 0.3s; z-index: 3000; }
    .toast.show { opacity: 1; }
    footer { text-align: center; color: var(--muted); font-size: 13px; padding: 20px; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <a href="#" class="logo" onclick="switchTab('home')">
        <img src="logo.jpg" alt="SN"><span class="logo-text">SN music</span>
      </a>
      <div style="display: flex; align-items: center;">
        <a href="auth.html" class="profile-btn" id="profileBtn">
          <div class="profile-avatar" id="profileAvatar">U</div><span class="profile-name-text" id="profileName">Профиль</span>
        </a>
        <button class="logout-btn" id="logoutBtn" onclick="logout()">Выйти</button>
      </div>
    </div>
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Треки, артисты, жанры...">
    </div>
  </header>

  <main>
    <div id="view-home" class="view-section active">
      <div class="upload-banner">
        <h2>Готов показать свой трек миру?</h2>
        <a href="upload.html" class="btn-upload">+ Загрузить трек</a>
      </div>
      <div class="section-header">
        <h2 class="section-title">Популярное</h2>
        <select class="sort-select" id="sortSelect">
          <option value="vip_new">Сначала VIP</option>
          <option value="new">Сначала новые</option>
          <option value="old">Сначала старые</option>
        </select>
      </div>
      <div class="tracks" id="tracksList"></div>
    </div>

    <div id="view-analytics" class="view-section">
      <h2 class="section-title" style="margin-bottom: 24px;">Аналитика</h2>
      <div class="analytics-grid">
        <div class="stat-card"><div class="stat-title">Всего треков</div><div class="stat-value" id="stat-total">0</div></div>
        <div class="stat-card"><div class="stat-title">Прослушиваний</div><div class="stat-value" id="stat-plays">0</div></div>
      </div>
      <div class="chart-box">
        <h3 style="font-size: 14px; margin-bottom: 20px; color: var(--muted);">Прослушивания за 7 дней</h3>
        <div class="chart-bars" id="chartBars"></div>
      </div>
      <h3 style="font-size: 16px; margin: 20px 0 10px 0;">Топ треков</h3>
      <div id="topTracksList"></div>
      <div id="admin-analytics-tools" style="display: none; margin-top: 40px; padding-top: 20px; border-top: 1px solid #333;">
        <button onclick="resetAnalytics()" style="width: 100%; background: rgba(239,68,68,0.1); border: 1px solid var(--danger); color: var(--danger); padding: 14px; border-radius: 12px; cursor: pointer;">Сбросить всю аналитику</button>
      </div>
    </div>
  </main>

  <footer>made by PlayTools</footer>

  <div class="bottom-player" id="bottomPlayer" onclick="openFullPlayer()">
    <img src="logo.jpg" class="bp-cover" id="bpCover">
    <div class="bp-info">
      <div class="bp-title" id="bpTitle">Название</div>
      <div class="bp-artist" id="bpArtist">Артист</div>
    </div>
    <div class="bp-controls">
      <button class="bp-btn play-pause" id="bpPlayBtn" onclick="event.stopPropagation(); togglePlay()"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item active" id="nav-home" onclick="switchTab('home')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Главная</span></a>
    <a class="nav-item" onclick="focusSearch()"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span>Поиск</span></a>
    <a href="upload.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Загрузить</span></a>
    <a class="nav-item" id="nav-analytics" onclick="switchTab('analytics')"><svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg><span>Аналитика</span></a>
    <a class="nav-item" id="nav-admin-item" onclick="requestAdminAccess()"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg><span>Админ</span></a>
    <a href="auth.html" class="nav-item" id="nav-profile-item"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Профиль</span></a>
  </nav>

  <div class="full-player" id="fullPlayer">
    <div class="fp-header">
      <button class="fp-close" onclick="closeFullPlayer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
      <div style="font-size: 12px; font-weight: 700; color: var(--muted);">СЕЙЧАС ИГРАЕТ</div>
      <div style="width: 36px;"></div>
    </div>
    <div class="fp-content">
      <img src="logo.jpg" class="fp-cover" id="fpCover">
      <div class="fp-title" id="fpTitle">Название</div>
      <a href="#" class="fp-artist" id="fpArtistLink">Артист</a>
      
      <!-- НОВЫЕ КНОПКИ В ПЛЕЕРЕ -->
      <div class="fp-extra-actions">
        <button class="fp-extra-btn" id="fpLikeBtn" onclick="toggleLikeFromPlayer()">♥</button>
        <button class="fp-extra-btn" onclick="addToPlaylistFromPlayer()">＋</button>
      </div>

    </div>
    <div style="width:100%;">
      <div class="custom-progress-container">
        <input type="range" class="custom-progress" id="progressBar" value="0" min="0" max="100" step="0.1">
        <div class="time-display"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div>
      </div>
      <audio id="mainAudio"></audio>
      <div class="fp-buttons">
        <button class="fp-btn" onclick="playPrev()"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button class="fp-btn play-pause" id="fpPlayBtn" onclick="togglePlay()"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="fp-btn" onclick="playNext()"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    const firebaseConfig = { apiKey: "AIzaSyCWlkDjzylbhDMl1bN33fn-sQx3BFTIfMc", authDomain: "sn-music-d3c6c.firebaseapp.com", projectId: "sn-music-d3c6c", storageBucket: "sn-music-d3c6c.firebasestorage.app", messagingSenderId: "308834788211", appId: "1:308834788211:web:367f727c45a812b8835b06" };
    const auth = getAuth(initializeApp(firebaseConfig));
    const supabaseClient = supabase.createClient('https://fgljnqcxjbpunlfwoktb.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnbGpucWN4amJwdW5sZndva3RiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2ODUzMzgsImV4cCI6MjEwODI2MTMzOH0.LPeIh77qTlhg8NmP5a6hZOVEDSgQeB57V6l8SMhXoeo');
    
    let currentUser = null, isAdmin = false, currentTracks = [], playQueue = [], currentIndex = -1, userLikes = [], searchQuery = '', currentPlayingTrack = null;
    const $ = (id) => document.getElementById(id), audio = $('mainAudio');

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user; 
        const { data: prof } = await supabaseClient.from('artist_profiles').select('name, avatar_url').eq('user_id', user.uid).single();
        const displayName = prof ? prof.name : user.email.split('@')[0];
        
        $('profileBtn').classList.add('active'); 
        $('profileName').textContent = displayName; 
        
        const avBtn = $('profileAvatar');
        if (prof && prof.avatar_url) {
           avBtn.style.backgroundImage = `url(${prof.avatar_url})`; avBtn.textContent = '';
        } else {
           avBtn.style.backgroundImage = 'none'; avBtn.textContent = displayName[0].toUpperCase();
        }

        $('logoutBtn').classList.add('active');
        if (user.email === "nur41games@gmail.com") { $('nav-admin-item').style.display = 'flex'; } 
        else { $('nav-admin-item').style.display = 'none'; window.isAdmin = false; }
        
        await loadLikes();
        loadTracks();
      } else {
        currentUser = null; isAdmin = false; userLikes = [];
        $('profileBtn').classList.remove('active'); 
        $('logoutBtn').classList.remove('active'); 
        $('nav-admin-item').style.display = 'none'; 
        loadTracks();
      }
    });

    window.logout = async () => { await signOut(auth); showToast('Вы вышли'); };
    window.requestAdminAccess = () => {
      if (currentUser?.email !== "nur41games@gmail.com") return;
      if (isAdmin) { isAdmin = false; showToast('Админ выключен'); loadTracks(); return; }
      if (prompt('Пароль:') === 'pl64637snj') { isAdmin = true; showToast('Админ включен'); loadTracks(); }
    };
    window.switchTab = (tab) => {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      $(`view-${tab}`).classList.add('active'); $(`nav-${tab}`).classList.add('active');
      if (tab === 'analytics') loadAnalytics();
    };
    window.focusSearch = () => { switchTab('home'); $('searchInput').focus(); };

    function formatTime(s) { if (isNaN(s) || s === Infinity) return "0:00"; const m = Math.floor(s/60), sec = Math.floor(s%60); return `${m}:${sec < 10 ? '0' : ''}${sec}`; }
    audio.addEventListener('timeupdate', () => { if (!audio.duration) return; const p = (audio.currentTime/audio.duration)*100; $('progressBar').value = audio.currentTime; $('currentTime').textContent = formatTime(audio.currentTime); $('progressBar').style.background = `linear-gradient(to right, #fff ${p}%, rgba(255,255,255,0.15) ${p}%)`; });
    audio.addEventListener('loadedmetadata', () => { $('progressBar').max = audio.duration; $('totalTime').textContent = formatTime(audio.duration); });
    $('progressBar').addEventListener('input', (e) => { audio.currentTime = parseFloat(e.target.value); });

    // ОБНОВЛЕННАЯ ФУНКЦИЯ setupTrack
    function setupTrack(track) {
      currentPlayingTrack = track;
      localStorage.setItem('sn_current_track', JSON.stringify(track));
      
      $('bpTitle').textContent = track.title; $('bpArtist').textContent = track.artist; 
      $('fpTitle').textContent = track.title; 
      
      // Делаем имя артиста ссылкой
      $('fpArtistLink').textContent = track.artist;
      $('fpArtistLink').href = `artist.html?name=${encodeURIComponent(track.artist)}`;
      
      const cover = track.cover_url || 'logo.jpg'; $('bpCover').src = cover; $('fpCover').src = cover;
      audio.src = track.audio_url; $('bottomPlayer').classList.add('active');

      // Обновляем кнопку лайка в плеере
      const isLiked = userLikes.includes(track.id);
      $('fpLikeBtn').className = `fp-extra-btn ${isLiked ? 'liked' : ''}`;
    }

    window.playTrack = (id) => { updateQueue(); currentIndex = playQueue.findIndex(t => t.id === id); if (currentIndex !== -1) { setupTrack(playQueue[currentIndex]); audio.play(); } };
    window.togglePlay = () => { if (audio.paused) { audio.play(); } else { audio.pause(); } };
    window.playNext = () => { if (currentIndex < playQueue.length - 1) { currentIndex++; setupTrack(playQueue[currentIndex]); audio.play(); } };
    window.playPrev = () => { if (currentIndex > 0) { currentIndex--; setupTrack(playQueue[currentIndex]); audio.play(); } };
    window.openFullPlayer = () => { $('fullPlayer').classList.add('show'); };
    window.closeFullPlayer = () => { $('fullPlayer').classList.remove('show'); };
    
    audio.addEventListener('play', () => { $('bpPlayBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'; $('fpPlayBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'; });
    audio.addEventListener('pause', () => { $('bpPlayBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'; $('fpPlayBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'; });

    async function loadLikes() { 
      if (!currentUser) return; 
      const { data } = await supabaseClient.from('likes').select('track_id').eq('user_id', currentUser.uid); 
      if (data) userLikes = data.map(l => l.track_id); 
      else userLikes = [];
    }

    // Лайк из плеера
    window.toggleLikeFromPlayer = async () => {
      if (!currentUser) return window.location.href = 'auth.html';
      if (!currentPlayingTrack) return;
      await window.toggleLike(currentPlayingTrack.id);
    };

    // Добавить в плейлист из плеера
    window.addToPlaylistFromPlayer = () => {
      if (!currentUser) return window.location.href = 'auth.html';
      if (!currentPlayingTrack) return;
      window.addToPlaylist(currentPlayingTrack.id);
    };

    window.toggleLike = async (id) => {
      if (!currentUser) return window.location.href = 'auth.html';
      const strId = String(id);
      if (userLikes.includes(strId)) { 
        await supabaseClient.from('likes').delete().match({ user_id: currentUser.uid, track_id: strId }); 
        userLikes = userLikes.filter(l => l !== strId); 
      } else { 
        await supabaseClient.from('likes').insert({ user_id: currentUser.uid, track_id: strId }); 
        userLikes.push(strId); 
      }
      
      // Обновляем кнопку в плеере, если открыт этот трек
      if (currentPlayingTrack && currentPlayingTrack.id === id) {
         $('fpLikeBtn').className = `fp-extra-btn ${userLikes.includes(strId) ? 'liked' : ''}`;
      }
      
      renderTracks();
    };

    window.addToPlaylist = async (trackId) => {
      if (!currentUser) return window.location.href = 'auth.html';
      const name = prompt('Название плейлиста:'); if (!name) return;
      let { data: pl } = await supabaseClient.from('playlists').select('*').eq('user_id', currentUser.uid).eq('name', name).single();
      if (!pl) { const { data: newPl } = await supabaseClient.from('playlists').insert({ user_id: currentUser.uid, name }).select().single(); pl = newPl; }
      await supabaseClient.from('playlist_tracks').insert({ playlist_id: pl.id, track_id: trackId });
      showToast('Добавлено в плейлист');
    };

    window.editGenre = async (id, old) => { if (!isAdmin) return; const ng = prompt('Жанр:', old); if (ng) { await supabaseClient.from('tracks').update({ genre: ng }).eq('id', id); loadTracks(); } };
    window.moderate = async (id, s) => { if (!isAdmin) return; await supabaseClient.from('tracks').update({ status: s }).eq('id', id); loadTracks(); };
    window.toggleVip = async (id, v) => { if (!isAdmin) return; await supabaseClient.from('tracks').update({ vip: !v }).eq('id', id); loadTracks(); };
    window.removeTrack = async (id) => { if (!isAdmin) return; if(confirm('Удалить?')) { await supabaseClient.from('tracks').delete().eq('id', id); loadTracks(); } };

    function renderTracks() {
      let list = currentTracks.filter(t => !searchQuery || t.title.toLowerCase().includes(searchQuery) || t.artist.toLowerCase().includes(searchQuery));
      list.sort((a, b) => (b.vip ? 1 : 0) - (a.vip ? 1 : 0));
      $('tracksList').innerHTML = list.map(t => {
        const cover = t.cover_url || 'logo.jpg';
        
        // ЖЕЛЕЗОБЕТОННАЯ ПРОВЕРКА ЛАЙКА (превращаем в строку для точного сравнения)
        const strId = String(t.id);
        const liked = userLikes.includes(strId);
        
        return `<div class="track ${t.vip ? 'vip' : ''}">
          <img src="${cover}" class="track-cover">
          <div class="track-info">
            <div class="track-title">${t.title}</div>
            <a href="artist.html?name=${encodeURIComponent(t.artist)}" class="track-artist">${t.artist}</a>
            <div class="track-meta"><span class="tag">${t.genre}</span><span class="tag plays">▶ ${t.plays || 0}</span></div>
          </div>
          <div class="action-btns">
            <button class="playlist-btn" onclick="addToPlaylist('${t.id}')">＋</button>
            <button class="like-btn ${liked ? 'liked' : ''}" onclick="toggleLike('${t.id}')">♥</button>
            <button class="play-btn" onclick='playTrack("${t.id}")'><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
          </div>
          ${isAdmin ? `<div class="admin-actions">
            ${t.status !== 'approved' ? `<button class="btn-admin" onclick="moderate('${t.id}','approved')">Одобрить</button>` : ''}
            <button class="btn-admin" onclick="toggleVip('${t.id}', ${t.vip})">${t.vip ? 'Снять VIP' : 'Сделать VIP'}</button>
            <button class="btn-admin" onclick="editGenre('${t.id}', '${t.genre}')">Править жанр</button>
            <button class="btn-admin delete" onclick="removeTrack('${t.id}')">Удалить</button>
          </div>` : ''}
        </div>`;
      }).join('');
    }

    async function loadTracks() {
      let q = supabaseClient.from('tracks').select('*'); if (!isAdmin) q = q.eq('status', 'approved');
      const { data } = await q; currentTracks = data || []; renderTracks(); updateQueue();
      
      // Проверяем, есть ли трек для авто-воспроизведения (из профиля)
      const pendingTrack = localStorage.getItem('sn_pending_track');
      if (pendingTrack) {
        localStorage.removeItem('sn_pending_track');
        const track = JSON.parse(pendingTrack);
        setupTrack(track);
        audio.play().catch(()=>{});
      }
    }
    function updateQueue() { playQueue = [...currentTracks].sort((a, b) => (b.vip ? 1 : 0) - (a.vip ? 1 : 0)); }

    async function loadAnalytics() {
      $('admin-analytics-tools').style.display = isAdmin ? 'block' : 'none';
      $('stat-total').innerText = currentTracks.length; $('stat-plays').innerText = currentTracks.reduce((s, t) => s + (t.plays || 0), 0);
      $('topTracksList').innerHTML = [...currentTracks].sort((a,b) => (b.plays||0)-(a.plays||0)).slice(0,5).map((t,i) => `<div class="top-track-item"><b>${i+1}</b><img src="${t.cover_url || 'logo.jpg'}" width="40" height="40" style="border-radius:8px;"><div style="flex:1">${t.title}</div><b style="color:var(--accent)">${t.plays || 0}</b></div>`).join('');
      const { data: hist } = await supabaseClient.from('play_history').select('created_at').gte('created_at', new Date(Date.now()-7*864e5).toISOString());
      const days = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб']; let chart = [];
      for(let i=6;i>=0;i--){ const d = new Date(Date.now()-i*864e5), ds = d.toISOString().split('T')[0]; chart.push({ l: days[d.getDay()], c: hist?.filter(h => h.created_at.startsWith(ds)).length || 0 }); }
      const max = Math.max(...chart.map(d=>d.c), 1);
      $('chartBars').innerHTML = chart.map(d => `<div class="bar-wrap"><div class="bar" style="height:${(d.c/max)*100}%"></div><span>${d.l}</span></div>`).join('');
    }
    window.resetAnalytics = async () => { if (!isAdmin) return; await supabaseClient.from('tracks').update({ plays: 0 }).neq('id','00000000-0000-0000-0000-000000000000'); await supabaseClient.from('play_history').delete().neq('id','00000000-0000-0000-0000-000000000000'); loadTracks(); };

    $('searchInput').addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase(); renderTracks(); });
    function showToast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
  </script>
</body>
</html>
