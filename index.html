<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎵 SN music</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b; --surface: #18181b; --surface-hover: #27272a;
      --text: #f4f4f5; --muted: #a1a1aa; --accent: #8b5cf6; --accent-hover: #7c3aed;
      --vip: #fbbf24; --danger: #ef4444; --radius: 16px;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 160px; overflow-x: hidden; }

    header { position: sticky; top: 0; z-index: 100; background: rgba(9, 9, 11, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo img { height: 36px; width: 36px; border-radius: 10px; object-fit: cover; }
    .logo-text { font-size: 20px; font-weight: 800; background: linear-gradient(90deg, #a78bfa, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
    
    .search-container { position: relative; width: 100%; }
    .search-container input { width: 100%; background: var(--surface); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 14px 20px 14px 48px; border-radius: 100px; font-size: 15px; outline: none; transition: 0.3s; }
    .search-container input:focus { border-color: var(--accent); background: var(--surface-hover); }
    .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 18px; }

    main { flex: 1; width: 100%; max-width: 800px; margin: 0 auto; padding: 24px 20px; }

    /* Списки */
    .upload-banner { background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(139,92,246,0.02)); border: 1px solid rgba(139,92,246,0.3); border-radius: var(--radius); padding: 32px 24px; margin-bottom: 32px; text-align: center; }
    .upload-banner h2 { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
    .btn-upload { background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; font-size: 16px; padding: 14px 28px; border-radius: 100px; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; border: none; cursor: pointer; }
    .btn-upload:hover { background: var(--accent-hover); transform: translateY(-2px); }

    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .section-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .sort-select { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--muted); padding: 8px 16px; border-radius: 100px; font-size: 13px; font-weight: 500; outline: none; cursor: pointer; }
    
    .tracks { display: flex; flex-direction: column; gap: 12px; }
    .track { background: var(--surface); border: 1px solid rgba(255,255,255,0.05); border-radius: var(--radius); padding: 12px; display: flex; align-items: center; gap: 16px; transition: 0.2s; position: relative; overflow: hidden; flex-wrap: wrap; }
    .track:hover { background: var(--surface-hover); transform: translateY(-1px); }
    .track.vip { border-color: rgba(251, 191, 36, 0.3); background: linear-gradient(90deg, rgba(251, 191, 36, 0.05), transparent); }
    .track-cover { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: #000; flex-shrink: 0; }
    .track-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .track-title { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-meta { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; align-items: center; }
    .tag { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 100px; background: rgba(255,255,255,0.1); color: var(--muted); }
    .tag.vip { background: rgba(251, 191, 36, 0.15); color: var(--vip); }
    .tag.plays { background: transparent; color: var(--accent); padding: 0 4px; }

    .play-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: white; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
    .play-btn svg { width: 20px; height: 20px; fill: currentColor; margin-left: 2px; }
    .play-btn:hover { transform: scale(1.05); background: var(--accent-hover); }

    .admin-actions { display: flex; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); width: 100%; }
    .btn-admin { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .btn-admin.delete { color: var(--danger); border-color: rgba(239,68,68,0.3); }

    /* АНАЛИТИКА */
    .analytics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); border: 1px solid rgba(255,255,255,0.05); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 8px; }
    .stat-title { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 32px; font-weight: 800; color: #fff; line-height: 1; }
    
    .chart-box { background: var(--surface); border: 1px solid rgba(255,255,255,0.05); border-radius: var(--radius); padding: 20px; margin-bottom: 24px; }
    .chart-bars { display: flex; align-items: flex-end; justify-content: space-between; height: 150px; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; }
    .bar { width: 100%; max-width: 30px; background: var(--accent); border-radius: 4px 4px 0 0; transition: height 0.5s ease; min-height: 2px; position: relative; }
    .bar:hover { background: var(--accent-hover); }
    .bar-tooltip { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; opacity: 0; transition: 0.2s; pointer-events: none; }
    .bar:hover .bar-tooltip { opacity: 1; }
    .bar-label { font-size: 11px; color: var(--muted); }
    
    .top-tracks { display: flex; flex-direction: column; gap: 12px; }
    .top-track-item { display: flex; align-items: center; gap: 12px; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 12px; }
    .top-track-rank { font-size: 18px; font-weight: 800; color: var(--accent); width: 24px; text-align: center; }

    /* ПЛЕЕРЫ (без изменений) */
    .bottom-player { position: fixed; bottom: 70px; left: 12px; right: 12px; background: rgba(24, 24, 27, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 10px 14px; display: none; align-items: center; gap: 12px; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.6); cursor: pointer; }
    .bottom-player.active { display: flex; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .bp-cover { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }
    .bp-info { flex: 1; min-width: 0; pointer-events: none; }
    .bp-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bp-artist { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bp-controls { display: flex; align-items: center; gap: 10px; z-index: 2; }
    .bp-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; color: var(--text); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .bp-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .bp-btn.play-pause { background: #fff; color: #000; width: 44px; height: 44px; }
    .bp-btn.play-pause svg { width: 24px; height: 24px; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: rgba(15, 19, 27, 0.95); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; align-items: center; z-index: 1001; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); text-decoration: none; font-size: 10px; font-weight: 500; transition: 0.2s; cursor: pointer; width: 20%; }
    .nav-item.active, .nav-item:hover { color: var(--accent); }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

    .full-player { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; padding: 24px; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); height: 100dvh; }
    .full-player.show { transform: translateY(0); }
    .fp-header { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; margin-bottom: 20px; }
    .fp-close { background: rgba(255,255,255,0.1); border: none; width: 40px; height: 40px; border-radius: 50%; color: var(--text); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .fp-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; width: 100%; max-width: 500px; margin: 0 auto; min-height: 0; }
    .fp-cover { width: 100%; max-width: 320px; max-height: 40vh; aspect-ratio: 1/1; border-radius: 20px; object-fit: cover; box-shadow: 0 20px 40px rgba(0,0,0,0.6); margin-bottom: 24px; background: var(--surface); }
    .fp-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
    .fp-artist { font-size: 16px; color: var(--muted); margin-bottom: 20px; font-weight: 500; }
    .fp-tags { display: flex; gap: 8px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap; }
    .fp-controls { width: 100%; flex-shrink: 0; padding-bottom: 10px; display: flex; flex-direction: column; gap: 16px; }
    audio { width: 100%; height: 40px; border-radius: 100px; outline: none; }
    audio::-webkit-media-controls-panel { background-color: var(--surface); }
    .fp-buttons { display: flex; align-items: center; justify-content: center; gap: 24px; }
    .fp-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .fp-btn svg { width: 28px; height: 28px; fill: currentColor; }
    .fp-btn:hover { color: var(--text); }
    .fp-btn.active { color: var(--accent); }
    .fp-btn.play-pause { width: 64px; height: 64px; background: #fff; color: #000; border-radius: 50%; }
    .fp-btn.play-pause svg { width: 32px; height: 32px; }
    
    .view-section { display: none; }
    .view-section.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--accent); color: white; padding: 12px 24px; border-radius: 100px; font-weight: 600; font-size: 14px; opacity: 0; transition: 0.3s; z-index: 3000; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    footer { text-align: center; color: var(--muted); font-size: 13px; padding: 20px; margin-top: auto; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <a href="#" class="logo" onclick="switchTab('home')">
        <img src="logo.jpg" alt="SN">
        <span class="logo-text">SN music</span>
      </a>
    </div>
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Треки, артисты, жанры...">
    </div>
  </header>

  <main>
    <!-- ЭКРАН: ГЛАВНАЯ -->
    <div id="view-home" class="view-section active">
      <div class="upload-banner">
        <h2>Готов показать свой трек миру?</h2>
        <a href="upload.html" class="btn-upload">+ Загрузить трек</a>
      </div>

      <div class="section-header">
        <h2 class="section-title">Популярное</h2>
        <select class="sort-select" id="sortSelect">
          <option value="vip_new">Сначала VIP</option>
          <option value="new">Сначала новые</option>
          <option value="old">Сначала старые</option>
        </select>
      </div>

      <div class="tracks" id="tracksList"></div>
    </div>

    <!-- ЭКРАН: АНАЛИТИКА -->
    <div id="view-analytics" class="view-section">
      <h2 class="section-title" style="margin-bottom: 24px;">Аналитика</h2>
      
      <div class="analytics-grid">
        <div class="stat-card">
          <div class="stat-title">Всего треков</div>
          <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Прослушиваний</div>
          <div class="stat-value" id="stat-plays">0</div>
        </div>
      </div>

      <div class="chart-box">
        <h3 style="font-size: 14px; font-weight: 600; margin-bottom: 20px; color: var(--muted);">Прослушивания за 7 дней</h3>
        <div class="chart-bars" id="chartBars">
          <!-- График заполнится скриптом -->
        </div>
      </div>

      <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 16px;">Топ треков</h3>
      <div class="top-tracks" id="topTracksList">
        <!-- Топ заполнится скриптом -->
      </div>
    </div>
  </main>

  <footer>made by PlayTools</footer>

  <!-- ПЛЕЕР -->
  <div class="bottom-player" id="bottomPlayer" onclick="openFullPlayer()">
    <img src="logo.jpg" class="bp-cover" id="bpCover">
    <div class="bp-info">
      <div class="bp-title" id="bpTitle">Название</div>
      <div class="bp-artist" id="bpArtist">Артист</div>
    </div>
    <div class="bp-controls">
      <button class="bp-btn" onclick="event.stopPropagation(); playPrev()"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="bp-btn play-pause" id="bpPlayBtn" onclick="event.stopPropagation(); togglePlay()"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="bp-btn" onclick="event.stopPropagation(); playNext()"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
  </div>

  <!-- НАВИГАЦИЯ -->
  <nav class="bottom-nav">
    <a class="nav-item active" id="nav-home" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Главная</span>
    </a>
    <a class="nav-item" onclick="focusSearch()">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span>Поиск</span>
    </a>
    <a href="upload.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Загрузить</span>
    </a>
    <a class="nav-item" id="nav-analytics" onclick="switchTab('analytics')">
      <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg><span>Аналитика</span>
    </a>
    <a class="nav-item" onclick="loginAdmin()">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Админ</span>
    </a>
  </nav>

  <!-- ПОЛНОЭКРАННЫЙ ПЛЕЕР -->
  <div class="full-player" id="fullPlayer">
    <div class="fp-header">
      <button class="fp-close" onclick="closeFullPlayer()">⌄</button>
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--muted);">СЕЙЧАС ИГРАЕТ</div>
      <div style="width: 40px;"></div>
    </div>
    <div class="fp-content">
      <img src="logo.jpg" class="fp-cover" id="fpCover">
      <div class="fp-title" id="fpTitle">Название</div>
      <div class="fp-artist" id="fpArtist">Артист</div>
      <div class="fp-tags" id="fpTags"></div>
    </div>
    <div class="fp-controls">
      <audio controls id="mainAudio"></audio>
      <div class="fp-buttons">
        <button class="fp-btn" id="btnShuffle" onclick="toggleShuffle()"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
        <button class="fp-btn" onclick="playPrev()"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button class="fp-btn play-pause" id="fpPlayBtn" onclick="togglePlay()"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="fp-btn" onclick="playNext()"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        <button class="fp-btn" id="btnRepeat" onclick="toggleRepeat()"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SUPABASE_URL = 'https://fgljnqcxjbpunlfwoktb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnbGpucWN4amJwdW5sZndva3RiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2ODUzMzgsImV4cCI6MjEwODI2MTMzOH0.LPeIh77qTlhg8NmP5a6hZOVEDSgQeB57V6l8SMhXoeo';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let isAdmin = false;
    let currentTracks = [];
    let searchQuery = '';
    let playQueue = []; 
    let currentIndex = -1;
    let isShuffle = false;
    let repeatMode = 0; 
    
    const $ = (id) => document.getElementById(id);
    const audio = $('mainAudio');

    function showToast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    // --- ВКЛАДКИ ---
    window.switchTab = function(tab) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      $(`view-${tab}`).classList.add('active');
      $(`nav-${tab}`).classList.add('active');
      if (tab === 'analytics') loadAnalytics();
    };
    window.focusSearch = function() { switchTab('home'); window.scrollTo({ top: 0, behavior: 'smooth' }); $('searchInput').focus(); };

    // --- АНАЛИТИКА (РЕАЛЬНЫЕ ДАННЫЕ) ---
    async function loadAnalytics() {
      // 1. Базовые цифры из уже загруженных треков
      const totalTracks = currentTracks.length;
      const totalPlays = currentTracks.reduce((sum, t) => sum + (t.plays || 0), 0);
      
      animateValue("stat-total", 0, totalTracks, 1000);
      animateValue("stat-plays", 0, totalPlays, 1000);

      // 2. Топ треков
      const topTracks = [...currentTracks].sort((a,b) => (b.plays || 0) - (a.plays || 0)).slice(0, 5);
      if (topTracks.length === 0) {
        $('topTracksList').innerHTML = '<p style="color:var(--muted); text-align:center;">Нет данных</p>';
      } else {
        $('topTracksList').innerHTML = topTracks.map((t, i) => `
          <div class="top-track-item">
            <div class="top-track-rank">${i + 1}</div>
            <img src="${t.cover_url || 'logo.jpg'}" style="width:40px;height:40px;border-radius:8px;object-fit:cover;">
            <div style="flex:1;min-width:0;">
              <div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(t.title)}</div>
              <div style="font-size:12px;color:var(--muted);">${escapeHtml(t.artist)}</div>
            </div>
            <div style="font-weight:700;color:var(--accent);">${t.plays || 0}</div>
          </div>
        `).join('');
      }

      // 3. График за 7 дней (запрашиваем реальную историю)
      try {
        const sevenDaysAgo = new Date();
        sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
        
        const { data: history, error } = await supabaseClient
          .from('play_history')
          .select('created_at')
          .gte('created_at', sevenDaysAgo.toISOString());

        if (error) throw error;

        const days = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
        let chartData = [];
        
        // Подготавливаем 7 дней
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const dateStr = d.toISOString().split('T')[0];
          const dayName = days[d.getDay()];
          
          // Считаем прослушивания за этот день
          const playsCount = history.filter(h => h.created_at.startsWith(dateStr)).length;
          chartData.push({ label: dayName, count: playsCount });
        }

        const maxPlays = Math.max(...chartData.map(d => d.count), 1); // Минимум 1 для масштаба
        
        $('chartBars').innerHTML = chartData.map(d => {
          const heightPercent = (d.count / maxPlays) * 100;
          return `
            <div class="bar-wrap">
              <div class="bar" style="height: ${heightPercent}%;">
                <div class="bar-tooltip">${d.count}</div>
              </div>
              <div class="bar-label">${d.label}</div>
            </div>
          `;
        }).join('');
        
      } catch (err) {
        console.error("Ошибка графика:", err);
        $('chartBars').innerHTML = '<div style="color:var(--danger); margin:auto;">Ошибка загрузки истории</div>';
      }
    }

    function animateValue(id, start, end, duration) {
      if (start === end) { $(id).innerHTML = end; return; }
      let range = end - start;
      let current = start;
      let increment = end > start ? 1 : -1;
      let stepTime = Math.abs(Math.floor(duration / range));
      let obj = $(id);
      let timer = setInterval(function() {
        current += increment;
        obj.innerHTML = current;
        if (current == end) clearInterval(timer);
      }, stepTime);
    }

    // --- ЛОГИКА ПЛЕЕРА И СЧЕТЧИКОВ ---
    function updatePlayQueue() {
      let filtered = [...currentTracks];
      if (searchQuery) {
        filtered = filtered.filter(t => t.title.toLowerCase().includes(searchQuery) || t.artist.toLowerCase().includes(searchQuery));
      }
      const sortBy = $('sortSelect').value;
      filtered.sort((a, b) => (b.vip ? 1 : 0) - (a.vip ? 1 : 0));
      filtered.sort((a, b) => {
        if (a.vip !== b.vip) return 0;
        const dateA = new Date(a.created_at).getTime(), dateB = new Date(b.created_at).getTime();
        return sortBy === 'old' ? dateA - dateB : dateB - dateA;
      });
      playQueue = filtered;
    }

    window.playTrack = function(id) {
      updatePlayQueue();
      currentIndex = playQueue.findIndex(t => t.id === id);
      if (currentIndex !== -1) {
        setupTrack(playQueue[currentIndex]);
        audio.play();
        localStorage.setItem('sn_is_playing', 'true');
      }
    };

    async function setupTrack(track) {
      localStorage.setItem('sn_current_track', JSON.stringify(track));
      
      $('bpTitle').textContent = track.title; $('bpArtist').textContent = track.artist;
      $('fpTitle').textContent = track.title; $('fpArtist').textContent = track.artist;
      
      const coverSrc = track.cover_url ? track.cover_url : 'logo.jpg';
      $('bpCover').src = coverSrc; $('fpCover').src = coverSrc;
      
      $('fpTags').innerHTML = `
        <span class="tag">${escapeHtml(track.genre)}</span>
        <span class="tag">${track.type === 'demo' ? 'демо' : 'релиз'}</span>
        ${track.vip ? '<span class="tag vip">★ VIP</span>' : ''}
      `;
      audio.src = track.audio_url; 
      $('bottomPlayer').classList.add('active');

      // СЧЕТЧИК ПРОСЛУШИВАНИЙ
      try {
        // 1. Увеличиваем счетчик в треке
        await supabaseClient.from('tracks').update({ plays: (track.plays || 0) + 1 }).eq('id', track.id);
        // 2. Добавляем запись в историю (для графика)
        await supabaseClient.from('play_history').insert({ track_id: track.id });
        // Обновляем локальные данные, чтобы при переходе в аналитику цифры были верными
        track.plays = (track.plays || 0) + 1; 
      } catch(e) { console.log('Ошибка счетчика:', e); }
    }

    window.togglePlay = function() {
      if (audio.paused) { audio.play(); localStorage.setItem('sn_is_playing', 'true'); } 
      else { audio.pause(); localStorage.setItem('sn_is_playing', 'false'); }
    };

    window.playNext = function() {
      if (playQueue.length === 0) return;
      if (isShuffle) {
        let nextIdx; do { nextIdx = Math.floor(Math.random() * playQueue.length); } while (playQueue.length > 1 && nextIdx === currentIndex);
        currentIndex = nextIdx;
      } else {
        currentIndex++;
        if (currentIndex >= playQueue.length) {
          if (repeatMode === 1 || repeatMode === 2) currentIndex = 0;
          else { currentIndex = playQueue.length - 1; audio.pause(); return; }
        }
      }
      setupTrack(playQueue[currentIndex]); audio.play(); localStorage.setItem('sn_is_playing', 'true');
    };

    window.playPrev = function() {
      if (playQueue.length === 0) return;
      if (isShuffle) {
        let prevIdx; do { prevIdx = Math.floor(Math.random() * playQueue.length); } while (playQueue.length > 1 && prevIdx === currentIndex);
        currentIndex = prevIdx;
      } else {
        currentIndex--;
        if (currentIndex < 0) {
          if (repeatMode === 1 || repeatMode === 2) currentIndex = playQueue.length - 1;
          else currentIndex = 0;
        }
      }
      setupTrack(playQueue[currentIndex]); audio.play(); localStorage.setItem('sn_is_playing', 'true');
    };

    window.toggleShuffle = function() { isShuffle = !isShuffle; $('btnShuffle').classList.toggle('active', isShuffle); showToast(isShuffle ? 'Перемешивание вкл' : 'Перемешивание выкл'); };
    window.toggleRepeat = function() {
      repeatMode = (repeatMode + 1) % 3;
      const btn = $('btnRepeat');
      if (repeatMode === 0) { btn.classList.remove('active'); showToast('Повтор выкл'); }
      else if (repeatMode === 1) { btn.classList.add('active'); showToast('Повтор плейлиста'); }
      else { btn.classList.add('active'); showToast('Повтор трека'); }
    };

    audio.addEventListener('ended', () => {
      if (repeatMode === 2) { audio.currentTime = 0; audio.play(); }
      else { playNext(); }
    });

    audio.addEventListener('play', () => { $('bpPlayBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'; $('fpPlayBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'; });
    audio.addEventListener('pause', () => { $('bpPlayBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'; $('fpPlayBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'; });

    function restorePlayer() {
      try {
        const savedTrack = JSON.parse(localStorage.getItem('sn_current_track'));
        if (savedTrack) {
          setupTrack(savedTrack); 
          loadTracks().then(() => {
            updatePlayQueue();
            currentIndex = playQueue.findIndex(t => t.id === savedTrack.id);
            if (localStorage.getItem('sn_is_playing') === 'true') { audio.play().catch(() => {}); }
          });
        }
      } catch(e) {}
    }

    window.openFullPlayer = function() { $('fullPlayer').classList.add('show'); };
    window.closeFullPlayer = function() { $('fullPlayer').classList.remove('show'); };

    // --- ОТРИСОВКА СПИСКА ---
    function renderTracks() {
      let filtered = [...currentTracks];
      if (searchQuery) filtered = filtered.filter(t => t.title.toLowerCase().includes(searchQuery) || t.artist.toLowerCase().includes(searchQuery));
      if (!filtered.length) { $('tracksList').innerHTML = '<div style="text-align: center; color: var(--muted); padding: 40px 0;">Здесь пока пусто...</div>'; return; }
      
      const sortBy = $('sortSelect').value;
      filtered.sort((a, b) => (b.vip ? 1 : 0) - (a.vip ? 1 : 0));
      filtered.sort((a, b) => {
        if (a.vip !== b.vip) return 0;
        const dateA = new Date(a.created_at).getTime(), dateB = new Date(b.created_at).getTime();
        return sortBy === 'old' ? dateA - dateB : dateB - dateA;
      });

      $('tracksList').innerHTML = filtered.map(t => {
        const coverSrc = t.cover_url ? t.cover_url : 'logo.jpg';
        return `
        <div class="track ${t.vip ? 'vip' : ''}">
          <img src="${coverSrc}" class="track-cover" alt="Cover">
          <div class="track-info">
            <div class="track-title">${escapeHtml(t.title)}</div>
            <div class="track-artist">${escapeHtml(t.artist)}</div>
            <div class="track-meta">
              <span class="tag">${escapeHtml(t.genre)}</span>
              <span class="tag plays">▶ ${t.plays || 0}</span>
            </div>
          </div>
          <button class="play-btn" onclick='playTrack("${t.id}")'><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
          ${isAdmin ? `
            <div class="admin-actions">
              ${t.status !== 'approved' ? `<button class="btn-admin" onclick="moderate('${t.id}','approved')">Одобрить</button>` : ''}
              <button class="btn-admin" onclick="toggleVip('${t.id}', ${t.vip})">${t.vip ? 'Снять VIP' : 'Сделать VIP'}</button>
              <button class="btn-admin delete" onclick="removeTrack('${t.id}')">Удалить</button>
            </div>
          ` : ''}
        </div>`}).join('');
    }

    async function loadTracks() {
      try {
        let query = supabaseClient.from('tracks').select('*');
        if (!isAdmin) query = query.eq('status', 'approved');
        const { data: tracks, error } = await query;
        if (error) throw error;
        currentTracks = tracks || [];
        renderTracks();
        updatePlayQueue();
        if ($('view-analytics').classList.contains('active')) loadAnalytics();
      } catch (err) {
        $('tracksList').innerHTML = `<div style="color: var(--danger);">Ошибка: ${err.message}</div>`;
      }
    }

    window.loginAdmin = function() {
      if (isAdmin) { isAdmin = false; showToast('Вы вышли'); loadTracks(); return; }
      const pass = prompt('Пароль администратора:');
      if (pass === 'pl64637snj') { isAdmin = true; showToast('Режим админа'); loadTracks(); }
    };
    window.moderate = async (id, status) => { await supabaseClient.from('tracks').update({ status }).eq('id', id); loadTracks(); };
    window.toggleVip = async (id, currentVip) => { await supabaseClient.from('tracks').update({ vip: !currentVip }).eq('id', id); loadTracks(); };
    window.removeTrack = async (id) => { if (!confirm('Удалить?')) return; await supabaseClient.from('tracks').delete().eq('id', id); loadTracks(); };

    restorePlayer();
    loadTracks(); 
  </script>
</body>
</html>
