<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Плеер — SN music</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0d0f14; --card: #161a22; --text: #e6e9ef;
      --muted: #8b93a7; --accent: #6c5ce7; --vip: #f5b301;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
    .close-btn { background: transparent; border: none; color: var(--text); font-size: 28px; cursor: pointer; text-decoration: none; line-height: 1; }
    
    .main-content { flex: 1; display: flex; flex-direction: column; padding: 20px; align-items: center; justify-content: center; text-align: center; max-width: 500px; margin: 0 auto; width: 100%; }
    
    /* Обложка */
    .cover { width: 100%; aspect-ratio: 1/1; background: var(--card); border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); margin-bottom: 30px; position: relative; overflow: hidden; }
    .cover img { width: 100%; height: 100%; object-fit: cover; }
    .cover-icon { font-size: 80px; opacity: 0.2; }
    .cover.vip-cover { border: 2px solid var(--vip); box-shadow: 0 0 30px rgba(245, 179, 1, 0.2); }

    .title { font-size: 24px; font-weight: 700; margin-bottom: 5px; }
    .artist { font-size: 18px; color: var(--muted); margin-bottom: 20px; }
    .desc { font-size: 14px; color: #a0a8b8; background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 30px; max-width: 100%; line-height: 1.6; }
    
    /* Элементы управления */
    .controls { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .audio-element { width: 100%; margin-bottom: 10px; }
    
    /* Кастомизация стандартного плеера (работает в Webkit - Chrome/Safari) */
    audio::-webkit-media-controls-panel { background-color: var(--card); }
    audio::-webkit-media-controls-current-time-display,
    audio::-webkit-media-controls-time-remaining-display { color: var(--text); }
    
    .tags { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
    .tag { display: inline-block; font-size: 12px; padding: 4px 10px; border-radius: 6px; background: var(--card); color: var(--muted); }
    .tag.vip { background: rgba(245, 179, 1, 0.15); color: var(--vip); }
    
    .loading { color: var(--muted); font-size: 16px; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="close-btn">⌄</a>
    <div style="font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px;">Сейчас играет</div>
    <div style="width: 28px;"></div> <!-- Для центрирования -->
  </header>

  <div class="main-content" id="playerContent">
    <div class="loading">Загрузка трека...</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://fgljnqcxjbpunlfwoktb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnbGpucWN4amJwdW5sZndva3RiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2ODUzMzgsImV4cCI6MjEwODI2MTMzOH0.LPeIh77qTlhg8NmP5a6hZOVEDSgQeB57V6l8SMhXoeo';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadPlayer() {
      const urlParams = new URLSearchParams(window.location.search);
      const trackId = urlParams.get('id');
      
      if (!trackId) {
        document.getElementById('playerContent').innerHTML = '<div class="loading">Трек не выбран</div>';
        return;
      }

      try {
        const { data: track, error } = await supabaseClient.from('tracks').select('*').eq('id', trackId).single();
        if (error || !track) throw new Error('Не найдено');

        document.getElementById('playerContent').innerHTML = `
          <div class="cover ${track.vip ? 'vip-cover' : ''}">
            <div class="cover-icon">🎵</div>
            <!-- Сюда можно добавить <img src="обложка.jpg"> если они будут -->
          </div>
          
          <div class="title">${escapeHtml(track.title)}</div>
          <div class="artist">${escapeHtml(track.artist)}</div>
          
          <div class="tags">
            <span class="tag">${escapeHtml(track.genre)}</span>
            <span class="tag">${track.type === 'demo' ? 'демо' : 'релиз'}</span>
            ${track.vip ? '<span class="tag vip">★ VIP</span>' : ''}
          </div>

          ${track.description ? `<div class="desc">${escapeHtml(track.description)}</div>` : ''}

          <div class="controls">
            <audio controls autoplay id="pageAudio" style="width: 100%;">
              <source src="${track.audio_url}" type="audio/mpeg">
            </audio>
          </div>
        `;
      } catch (err) {
        document.getElementById('playerContent').innerHTML = '<div class="loading">Ошибка загрузки трека</div>';
      }
    }

    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    
    loadPlayer();
  </script>
</body>
</html>
